# EXAMPLE VALUES ONLY. Check current pricing on your provider's pricing page
# before relying on these numbers. Prices change, and veilox can't know them.
#
# All prices are USD per 1 million tokens.
# A name ending in * matches every model that starts with it (dated versions).
# cached_input / cache_read: price of cached prompt tokens (defaults to input).
# cache_write: price of writing to the prompt cache (defaults to input).
currency: USD
models:
  gpt-6.1-terra:
    input: 1.00
    cached_input: 0.25
    output: 4.00
  gpt-6-luna:
    input: 0.20
    cached_input: 0.05
    output: 0.80
  "claude-sonnet-5-5*":
    input: 1.00
    cache_write: 1.25
    cache_read: 0.10
    output: 5.00
  "claude-haiku-5-5*":
    input: 0.25
    cache_write: 0.31
    cache_read: 0.03
    output: 1.25
